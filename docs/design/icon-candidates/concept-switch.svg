<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="One Switch">
  <!-- 备选概念 · Switch：最贴名字 —— 一枚开关，右端是"已切换"的状态 -->
  <defs>
    <linearGradient id="os" gradientUnits="userSpaceOnUse" x1="24" y1="128" x2="232" y2="128">
      <stop stop-color="#00D492"/>
      <stop offset="0.52" stop-color="#00BBF9"/>
      <stop offset="1" stop-color="#5B6CFF"/>
    </linearGradient>
  </defs>
  <rect x="24" y="64" width="208" height="128" rx="64" fill="url(#os)"/>
  <circle cx="168" cy="128" r="48" fill="#FFFFFF"/>
</svg>
