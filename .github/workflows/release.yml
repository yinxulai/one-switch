name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, 0.1.0 or v0.1.0)
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - name: Check out release branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          # 这一节跑的是裸 lint / typecheck / vitest，不经过 turbo。
          turbo-cache: 'false'
          tool-cache: 'true'

      - name: Validate version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $INPUT_VERSION"
            exit 1
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists; this workflow will update the existing release instead of failing."
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # 版本号只写在仓库根的 manifest 里：脚本从 `pnpm-workspace.yaml` 现算 workspace 包目录，
      # 把根版本强制覆盖到每一份 manifest（加包不用改这里，也不用改下面的 `git add`）。
      - name: Update package versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node packages/toolkit/scripts/version.mjs "$VERSION"

      - name: Run release checks
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test:server

      - name: Commit version
        id: commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 这两对 glob 必须和 `version.mjs` 覆盖的是同一批包（`pnpm-workspace.yaml` 的
          # `packages/*` 与 `apps/*`）。这里曾把后者写死成 `apps/app`，于是 `apps/cli` 一路没被提交：
          # `1.1.0-beta.3` 发出去之后，仓库里它还是 `1.1.0-beta.2`——产物是对的、本地全绿，看不出来。
          # `pnpm lint` 里的 `version.mjs --check` 是兜底：漏提交一份，CI 就红。
          git add package.json pnpm-lock.yaml apps/*/package.json packages/*/package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): $VERSION"
            git push origin HEAD:${{ github.ref_name }}
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            artifact: macos
            asset: |
              release/**/*.dmg
              release/**/*.zip
          - name: Windows
            os: windows-latest
            artifact: windows
            asset: release/**/OSW-*.exe
          - name: Linux
            os: ubuntu-latest
            artifact: linux
            asset: release/**/OSW-*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Set up environment
        uses: ./.github/actions/setup

      # `pnpm release:*` = `turbo run build` + electron-builder。
      # 矩阵里的三个系统各存各的 Turbo 缓存（key 里带 runner.os），不会互相覆盖。
      - name: Build installer
        run: ${{ runner.os == 'macOS' && 'pnpm release:mac' || runner.os == 'Windows' && 'pnpm release:win' || 'pnpm release:linux' }}

      - name: Create installer checksums
        shell: bash
        run: |
          # 每个安装包都配一份 `.sha256`：发布说明的下载表把校验链接放在文件名旁边，
          # 只给 macOS 的 dmg 算，表里其余几行就只能写「—」，看起来像漏了。
          # GNU 的 `sha256sum` 与 Perl 的 `shasum` 参数不同：`-a 256` 只有 `shasum` 认，
          # `sha256sum` 会直接报 `unknown option -- a`（Windows 的 bash 来自 Git for Windows，
          # 它只提供 `sha256sum`，这一条曾经让整个 Windows 构建挂在最后一步）。
          # 两者的输出格式一致（`<hash>  <name>`），所以按可用性挑一个再统一调用。
          hash256() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1"
            else
              shasum -a 256 "$1"
            fi
          }
          # `release/` 下不只有安装包：`<version>/win-unpacked/` 里还放着 electron-builder
          # 自己的可执行文件（`OSW.exe`、`elevate.exe`）。宽泛的 `-name '*.exe'` 会把它们
          # 一起算进来，而这些文件不匹配上面 `matrix.asset` 的上传 glob，结果 release 里会多出
          # 两个「点进去是 404」的 `.sha256`（2026-09 的 beta.2 就发了 `OSW.exe.sha256`
          # 和 `elevate.exe.sha256`）。安装包一律是 `OSW-<版本>-<平台>-<架构>.exe`
          # （见 `electron-builder.config.cjs` 的 `artifactName`），所以 exe 用带前缀的模式限定，
          # `.dmg` / `.AppImage` 不会出现在 unpacked 目录里，保持原样即可。
          while IFS= read -r INSTALLER; do
            DIR=$(dirname "$INSTALLER")
            NAME=$(basename "$INSTALLER")
            (cd "$DIR" && hash256 "$NAME" > "$NAME.sha256")
          done < <(find release -type f \( -name '*.dmg' -o -name 'OSW-*.exe' -o -name '*.AppImage' \))

      - name: Collect installer and update metadata
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          # 发布产物包含：
          # - 安装包（.dmg/.zip/.exe/.AppImage）
          # - .blockmap：electron-updater 差量更新所需
          # - latest*.yml：electron-updater 版本检查元数据
          #   （latest.yml / latest-mac.yml / latest-linux.yml）
          path: |
            ${{ matrix.asset }}
            release/**/*.blockmap
            release/**/latest*.yml
            release/**/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          # 发布说明要按「离 HEAD 最近的发布标签」划变更范围，标签必须都在本地。
          fetch-tags: true

      - name: Create release tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$TAG" -m "Release $TAG"
          git push --force origin "$TAG"

      - name: Download installers
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      # 发布说明由提交记录生成：按提交类型分组、从中读出破坏性变更、再用真实产物拼下载表。
      # 脚本只用 node 内建模块，不需要依赖安装，所以这里不引入 setup 步骤。
      - name: Generate release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          node apps/app/scripts/release-notes.mjs \
            --version "$VERSION" \
            --tag "$TAG" \
            --assets-dir artifacts \
            --output "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: OSW ${{ needs.prepare.outputs.tag }}
          body_path: ${{ runner.temp }}/release-notes.md
          # 不开 `generate_release_notes`：它附带的那行 Full Changelog 与生成脚本自己写的
          # 重复，两行怎么合并由 action 决定，不如自己只留一行。
          prerelease: ${{ inputs.prerelease }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: artifacts/**/*
