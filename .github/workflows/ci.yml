name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # `pnpm typecheck` 直接跑 tsc（一次覆盖四棵源码树），不经过 turbo，
      # 所以 `.turbo` 缓存永远 miss；tool-cache 换来的则是 tsc 增量信息。
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          turbo-cache: 'false'
          tool-cache: 'true'

      - name: Run typecheck
        run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # 同 typecheck：ESLint 从仓库根一次跑完，不经过 turbo。
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          turbo-cache: 'false'
          tool-cache: 'true'

      - name: Run lint
        run: pnpm lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # vitest 同样不由 turbo 驱动，也没有值得留到下轮的产物。
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          turbo-cache: 'false'

      # 只跑一次：`test:coverage` 本身就是「跑全部测试 + 收集覆盖率」，
      # 再单独跑一遍 `test:server` 等于把 1100 个用例执行两遍。
      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: server-coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 7

  # 这里**没有** build job，是有意的。
  #
  # 它曾经存在过（`needs: [typecheck, test]`，跑 `pnpm build` 后上传产物），代价是每次 push
  # 都要在 ubuntu 上把渲染层与宿主整个打一遍，换来的只是一份没人下载的 artifact。
  # 而真正需要验证打包能不能过的地方本来就有两个，且都比它准：
  #   - Worker：Cloudflare Workers Builds 里的 build 命令（`pnpm run build`，见
  #     `apps/apis/wrangler.toml` 的头部注释）——参数与线上部署完全一致；
  #   - 桌面端：`release.yml`，release 时在三个平台上跑真实打包，那才是产物定义。
  # typecheck / lint / test 继续覆盖「代码是不是对的」，构建由上面两处覆盖「产物是不是出得来」。
