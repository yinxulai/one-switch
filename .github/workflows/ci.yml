name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up environment
        uses: ./.github/actions/setup

      - name: Run typecheck
        run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up environment
        uses: ./.github/actions/setup

      - name: Run lint
        run: pnpm lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up environment
        uses: ./.github/actions/setup

      # 只跑一次：`test:coverage` 本身就是「跑全部测试 + 收集覆盖率」，
      # 再单独跑一遍 `test:server` 等于把 1100 个用例执行两遍。
      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: server-coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build application
    needs: [typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up environment
        uses: ./.github/actions/setup

      # `pnpm build` 就是 `turbo run build`：按包依赖顺序构建，
      # 并且 `typecheck` / `test` 已经跑过一遍的包在这里会直接命中缓存。
      - name: Build application
        run: pnpm build

      - name: Upload build output
        uses: actions/upload-artifact@v6
        with:
          name: one-switch-build
          # 渲染层与宿主各自构建到自己的包目录里，仓库根不再有 `dist/`。
          path: |
            packages/console/dist/
            apps/app/dist/
            release/**/*.AppImage
          if-no-files-found: error
          retention-days: 7
