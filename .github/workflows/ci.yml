name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # `pnpm typecheck` 直接跑 tsc（一次覆盖四棵源码树），不经过 turbo，
      # 所以 `.turbo` 缓存永远 miss；tool-cache 换来的则是 tsc 增量信息。
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          turbo-cache: 'false'
          tool-cache: 'true'

      - name: Run typecheck
        run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # 同 typecheck：ESLint 从仓库根一次跑完，不经过 turbo。
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          turbo-cache: 'false'
          tool-cache: 'true'

      - name: Run lint
        run: pnpm lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # vitest 同样不由 turbo 驱动，也没有值得留到下轮的产物。
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          turbo-cache: 'false'

      # 只跑一次：`test:coverage` 本身就是「跑全部测试 + 收集覆盖率」，
      # 再单独跑一遍 `test:server` 等于把 1100 个用例执行两遍。
      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: server-coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build application
    needs: [typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up environment
        uses: ./.github/actions/setup

      # `pnpm build` 就是 `turbo run build`：按包依赖顺序构建。
      # 这是全仓唯一会写 `.turbo` 的 job，所以缓存开关保持默认开启：
      # 上游没变的包会直接命中缓存，`Time: 34ms >>> FULL TURBO` 是常态。
      # 注意缓存来自本 job 的历史运行，不是同一轮里 typecheck / test 的结果
      # ——那两个 job 跑的是裸 tsc 与 vitest，根本不产生 turbo 任务记录。
      - name: Build application
        run: pnpm build

      - name: Upload build output
        uses: actions/upload-artifact@v6
        with:
          name: osw-build
          # 渲染层与宿主各自构建到自己的包目录里，仓库根不再有 `dist/`。
          path: |
            packages/console/dist/
            apps/app/dist/
            release/**/*.AppImage
          if-no-files-found: error
          retention-days: 7
