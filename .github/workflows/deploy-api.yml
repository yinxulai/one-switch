name: Deploy telemetry API

# 只有一个触发点：`main` 上**影响 Worker 产物**的文件发生了变化。
#
# 不做「每次都部署」是刻意的：Worker 的地址是已发布客户端里写死的唯一地址，一次误部署会把所有
# 装机量同时推到新代码上，而回滚要再走一遍流水线。所以这里的判断不是「有没有新提交」，
# 而是「打包出来会不会不一样」。
on:
  push:
    branches: [main]
    paths:
      - 'apps/apis/**'
      # Worker 直接打包 `packages/contracts/source`（`@common/*` 别名），改契约就是改产物。
      - 'packages/contracts/source/**'
      - 'tsconfig.base.json'
      - 'tsconfig.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/actions/setup/action.yml'
      - '.github/workflows/deploy-api.yml'
  # 手动补一次。换 secret、或想在同一个提交上重跑一次部署时需要它
  # （secret 不是仓库里的文件，push 触发不了）。
  workflow_dispatch:

# 部署不需要写仓库。
permissions:
  contents: read

# **不取消进行中的部署**（与 ci.yml 相反）：半途被打断的部署可能只推了一半的版本，
# 而这里排队的那一次总会带着最新的代码把状态收敛回来。
concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          turbo-cache: 'false'

      # 部署前先跑 Worker 自己的用例。它们不碰网络（下游是替身），一秒内跑完，
      # 挡的是「校验规则被改坏了但没人发现」这类最贵的错误：事件会静默丢，线上看不出来。
      #
      # 这是**针对 Worker 的自查**，不是 CI 的替代品——`main` 上的完整 CI 与本工作流并行跑，
      # 两者互不等待。仓库在这一点上是诚实的：能拦住的东西只有它真正检查的那些。
      - name: Test Worker
        run: pnpm test -- apps/apis

      # 先确认凭证在，再交给 wrangler。少了 secret 时 wrangler 的报错是一串 OAuth 提示，
      # 读起来像「代码有问题」；这里直接说清楚缺什么、去哪里加。
      - name: Check credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::缺少仓库 secret CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，见 docs/product/telemetry.md §7"
            exit 1
          fi

      # 与开发者在本地跑的是同一条命令（`apps/apis/package.json` 的 `deploy`），
      # 这样「CI 上能过、本地不能过」不再是需要单独解释的一种情况。
      #
      # `GA_MEASUREMENT_ID` 与 `GA_API_SECRET` 不在这里：它们是 Worker 的 secret
      # （`wrangler secret put`），配一次就跟着 Worker 走，不随每次部署传递。
      - name: Deploy
        working-directory: apps/apis
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm deploy

      # 部署之后摸一下端点。Worker 上**只有 `POST /v1/track` 一条路径**，所以这里特意用 `GET`：
      # 405 + `allow: POST` 是「路径对了、方法不对」的答案，只可能来自本 Worker——一个没人绑定的
      # 域名给不出它，一个 404 也答不出它。部署后要确认的本来就只有「路由注册上了没有」，
      # 而一条只接受写入的接口没有安全的匿名读探针，这个 405 就是最便宜的那个证据。
      #
      # **失败不拦流水线**：域名/路由的生效可能滞后于部署，而为了 DNS 的几十秒把一次已经
      # 推上去的部署标红只会教人忽略红色。这一条的输出是给人看的。
      - name: Smoke check
        continue-on-error: true
        run: |
          set -o pipefail
          # 地址与路径分别来自 packages/contracts/source/telemetry.ts 的
          # TELEMETRY_ENDPOINT / TELEMETRY_REQUEST_PATH，改契约时一起改。
          response=$(curl -s -o /dev/null -D - -w '\n%{http_code}' --max-time 10 \
            https://api.osw.yinxulai.com/v1/track || true)
          status=$(printf '%s' "$response" | tail -n 1)
          echo "GET /v1/track -> $status"
          if [ "$status" != "405" ]; then
            echo "::warning::探针期待 405（路由在、方法不对），实际得到 $status。若刚刚才绑上自定义域名，等几十秒再试；否则检查域名与 TELEMETRY_ENDPOINT 是否一致。"
          elif ! printf '%s' "$response" | grep -qi '^allow:.*POST'; then
            echo "::warning::路由在，但响应没有 Allow: POST —— 与 index.ts 的 methodNotAllowed 不一致。"
          fi
