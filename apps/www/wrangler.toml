# 产品官网。部署由 **Cloudflare 侧的 Workers Git 集成**完成（Dashboard → Workers & Pages →
# 本项目 → Settings → Build）：Root directory `apps/www`，Build `pnpm install && pnpm build`，
# Deploy `npx wrangler deploy`。仓库里不放部署流水线（不用 GitHub Actions）。
#
# Worker 只做「静态资源 + 一条下载路由」：Vite 产物（`output/`）由 Static Assets 托管，
# `/~asset/<platform>` 从 R2 桶流式返回安装包（见 `worker/index.ts`）。
# 目录名与 `source/` 对仗：`source` 进、`output` 出。

name = "osw-www"
main = "worker/index.ts"

compatibility_date = "2026-01-01"

# ---------------------------------------------------------------- 自定义域名
#
# ⚠️ 上线前必须做这一步（与 `apps/apis` 同理）：站点地址是发布到各处的永久地址，
# 不能依赖 `workers.dev` 子域。这里直接声明绑定，`wrangler deploy` 会顺带创建 DNS 记录并申请证书。
#
# 前提：`yinxulai.com` 这个 zone 在**同一个 Cloudflare 账号**下。不满足时 deploy 会报错
# （找不到 zone），需把 zone 挪到本账号，或删掉 `routes` 改到后台手动绑定。
#
# ⚠️ 这一块必须在**任何 `[表头]` 之前**：TOML 里 `[assets]` / `[[r2_buckets]]` 之后的键
# 都会落入那张表，放错位置只会得到「Unexpected fields found in …」的告警，而部署照常进行。
routes = [
  { pattern = "osw.yinxulai.com", custom_domain = true },
]

# 静态资源：Vite 构建产物。`not_found_handling` 让任意深层路径都回落到 SPA 入口。
[assets]
directory = "./output"
binding = "ASSETS"
not_found_handling = "single-page-application"

# R2 桶：承载安装包（`<version>/OSW-*.{dmg,exe,AppImage}`）。上传方式见 README.md。
[[r2_buckets]]
binding = "DOWNLOADS"
bucket_name = "osw-downloads"

# ---------------------------------------------------------------- 密钥
#
# 本 Worker 当前不需要 secret（R2 桶通过 `r2_buckets` 绑定）。若下载路由日后要加
# 访问控制或统计，可在此配 `wrangler secret put` 的项并在此注明。
