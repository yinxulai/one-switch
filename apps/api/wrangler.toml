# 匿名使用统计的上报端点。
#
# 部署：`pnpm --filter @one-switch/api deploy`（CI 在 `apps/api/**` 变更并合入 `main` 时自动跑，
# 见 `.github/workflows/deploy-api.yml`）。密钥不在这里，用 `wrangler secret put` 配一次。

name = "one-switch-telemetry"
main = "source/index.ts"

# 固定兼容日期，不跟最新：Worker 的运行期行为以它为界，改它等于悄悄换一次运行时语义。
# 升级应当是一次单独的、能被回滚的提交，而不是顺手搭在别的改动上。
compatibility_date = "2026-01-01"

[observability]
# 打开 Worker 的日志与指标。日志里**没有**安装标识、没有来源地址、没有报文正文——
# 这一段只回答「端点活着吗、下游答不答」，不回答「谁在发」。
enabled = true

# ---------------------------------------------------------------- 自定义域名
#
# **上线前必须做这一步。** 客户端里写死的地址是自有域名，`workers.dev` 子域绑在平台命名空间上、
# 改名即作废，不能让已发布的客户端依赖它。
#
# 在 Cloudflare 后台把 `telemetry.one-switch.app`（或别的自有域名）加到本 Worker 的
# Custom Domains 里，然后把 `@common/telemetry` 的 `TELEMETRY_ENDPOINT` 改成同一个地址。
# 两者不一致时事件会打到默认的 `workers.dev` 域上——能跑通，但「发布出去的地址就是永久地址」
# 这条就废了。
#
# 域名配好之后，在它的 Rate limiting rules 里加一条针对 `POST /v1/events` 的规则：
# Worker 里的限流是尽力而为的（见 `source/rate-limit.ts` 的说明），跨机房洪峰要靠域名级规则挡。

# ---------------------------------------------------------------- 路由
#
# 只有两条，都写在 `source/index.ts` 里，这里只是让部署的人知道域名上有哪些地址在服务：
#
#   GET|HEAD /health     部署流水线的探针。不碰下游、不碰限流、不要求密钥配好，
#                        恒回 200，正文里的 `upstream` 报下游配没配。**别占根路径 `/`**——
#                        那是块永久地址，留给以后真正需要它的东西。
#   POST     /v1/events  客户端契约，路径永久。限流规则盯的是它。
#
# 其余路径一律 404（`/` 也是），所以域名上不会出现「不知道为什么有回应」的地址。

# ---------------------------------------------------------------- 密钥
#
#   wrangler secret put GA_MEASUREMENT_ID    # G-XXXXXXXXXX
#   wrangler secret put GA_API_SECRET        # GA 后台「数据流 → Measurement Protocol API 密钥」
#
# 可选：`wrangler secret put TELEMETRY_STRICT_VALIDATION`（值 `1`）只在排查埋点问题时开，
# 它会让 GA 反馈被忽略的参数并可能拒收事件（见 `source/ga.ts`）。排查完记得删掉。
